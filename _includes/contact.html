<section class="contact-panel" aria-labelledby="contact-title">
  <div>
    <p class="eyebrow">{{ include.eyebrow | default: 'Correspondence' }}</p>
    <h2 id="contact-title">{{ include.title | default: 'Write to the lab.' }}</h2>
    <p>{{ include.text | default: 'A problem, a proposal or a correction. Start with a conversation.' }}</p>
  </div>
  <div class="actions">
    <a class="btn btn-primary" href="https://calendar.app.google/STaVQe2MtVSXfrTR9" target="_blank" rel="noopener">{{ include.button | default: 'Book a call' }} <span aria-hidden="true">↗</span></a>
    <a class="text-link" href="mailto:{{ site.email }}">{{ site.email }}</a>
  </div>
</section>
